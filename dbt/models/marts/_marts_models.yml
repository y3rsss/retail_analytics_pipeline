version: 2

models:
  - name: dim_customers
    description: One row per actual customer (customer_unique_id), with their latest address and first order date.
    columns:
      - name: customer_unique_id
        data_tests:
          - unique
          - not_null

  - name: dim_products
    description: One row per product, with an English, display-ready category name.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: category_name
        data_tests:
          - not_null

  - name: dim_sellers
    description: One row per seller.
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null

  - name: dim_date
    description: One row per calendar day across the order date range.
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: fct_orders
    description: One row per order, with item, payment, delivery and latest-review metrics.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: purchase_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_order_items
    description: One row per item sold.
    columns:
      - name: order_item_key
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: customer_unique_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: purchase_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day